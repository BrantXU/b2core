<!DOCTYPE html>
<html>
<head>
    <title>测试添加控件功能</title>
    <link href="/static/css/uikit.min.css" rel="stylesheet">
    <script src="/static/js/uikit.min.js"></script>
    <script src="/static/js/widgetEditor.js"></script>
</head>
<body>
    <div class="uk-container uk-margin-top">
        <h2>测试添加控件功能</h2>
        
        <button class="uk-button uk-button-primary" onclick="testAddWidget()">测试添加控件</button>
        
        <div id="widgetList" class="uk-grid uk-grid-small uk-child-width-1-1 uk-margin-top" uk-grid>
            <div class="uk-width-1-1">
                <div class="uk-alert uk-alert-warning">暂无控件</div>
            </div>
        </div>
    </div>

    <script>
        // 模拟全局config对象
        window.config = {
            item: {}
        };
        
        // 初始化widgetEditor
        document.addEventListener('DOMContentLoaded', function() {
            window.widgetEditor = new WidgetEditor({
                configId: 'test123',
                tenantId: 'default'
            });
        });
        
        function testAddWidget() {
            if (window.widgetEditor) {
                window.widgetEditor.addWidget();
            } else {
                UIkit.notification('widgetEditor未初始化', {status: 'danger'});
            }
        }
    </script>
</body>
</html>
