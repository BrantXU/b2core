<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表字段调试</title>
    <link rel="stylesheet" href="/static/css/uikit.min.css">
    <script src="/static/js/uikit.min.js"></script>
    <script src="/static/js/dom.js"></script>
    <script src="/static/js/widgetRender.js"></script>
    <script src="/static/js/tableRender.js"></script>
</head>
<body>
    <div class="uk-container uk-margin-top">
        <h2>图表字段调试</h2>
        
        <div id="test-table-container">
            <table id="test-table">
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>年龄</th>
                        <th>薪资</th>
                        <th>部门</th>
                    </tr>
                </thead>
                <tbody>
                    <tr data-row-id="1">
                        <td>张三</td>
                        <td>28</td>
                        <td>8000</td>
                        <td>技术部</td>
                    </tr>
                    <tr data-row-id="2">
                        <td>李四</td>
                        <td>32</td>
                        <td>12000</td>
                        <td>销售部</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="uk-margin-top">
            <button class="uk-button uk-button-primary" onclick="debugChart()">调试图表字段</button>
        </div>
        
        <div id="debug-output" class="uk-margin-top uk-card uk-card-default uk-card-body">
            <h4>调试输出：</h4>
            <pre id="debug-content"></pre>
        </div>
    </div>

    <script>
        // 初始化表格渲染器
        const tableRenderer = new TableRender('test-table', {
            fields: {
                name: { label: '姓名', type: 'text' },
                age: { label: '年龄', type: 'number' },
                salary: { label: '薪资', type: 'yuan' },
                department: { label: '部门', type: 'select' }
            },
            showChart: true
        });
        
        // 调试图表字段
        function debugChart() {
            const debugContent = document.getElementById('debug-content');
            debugContent.textContent = '';
            
            // 获取表头字段
            const headers = tableRenderer._getTableHeaders();
            debugContent.textContent += '表头字段: ' + JSON.stringify(headers) + '\n\n';
            
            // 获取字段类型信息
            const fieldTypes = tableRenderer._getFieldTypes();
            debugContent.textContent += '字段类型映射: ' + JSON.stringify(fieldTypes, null, 2) + '\n\n';
            
            // 检查字段匹配
            debugContent.textContent += '字段匹配检查:\n';
            headers.forEach(header => {
                const fieldType = fieldTypes[header] || '未知';
                const isText = tableRenderer._isTextField(fieldType);
                const isNumeric = tableRenderer._isNumericField(fieldType);
                
                debugContent.textContent += `- "${header}": type=${fieldType}, text=${isText}, numeric=${isNumeric}\n`;
            });
            
            // 测试过滤功能
            const textFields = headers.filter(header => {
                const fieldType = fieldTypes[header] || 'text';
                return tableRenderer._isTextField(fieldType);
            });
            
            const numericFields = headers.filter(header => {
                const fieldType = fieldTypes[header] || 'text';
                return tableRenderer._isNumericField(fieldType);
            });
            
            debugContent.textContent += '\n文本类字段: ' + JSON.stringify(textFields) + '\n';
            debugContent.textContent += '数值类字段: ' + JSON.stringify(numericFields) + '\n';
            
            // 显示图表模态框
            tableRenderer.showChartModal();
        }
    </script>
</body>
</html>
