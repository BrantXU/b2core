<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表展开状态控制测试</title>
    <link rel="stylesheet" href="/static/css/uikit.min.css">
    <link rel="stylesheet" href="/static/css/ionicons.min.css">
    <script src="/static/js/uikit.min.js"></script>
    <script src="/static/js/dom.js"></script>
    <script src="/static/js/tableRender.js"></script>
    <style>
        body {
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-description {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>图表展开状态控制测试</h1>
        
        <div class="test-description">
            <h3>功能说明：</h3>
            <ul>
                <li>✅ 已移除图表容器的关闭按钮</li>
                <li>✅ 通过图表分析按钮的色彩来控制图表展开状态</li>
                <li>✅ 按钮默认样式：灰色背景（未展开状态）</li>
                <li>✅ 按钮激活样式：蓝色背景（已展开状态）</li>
                <li>✅ 点击按钮可切换图表的展开和收起状态</li>
            </ul>
        </div>

        <table id="test-table" class="uk-table uk-table-striped uk-table-hover">
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>年龄</th>
                    <th>薪资</th>
                    <th>部门</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>张三</td>
                    <td>28</td>
                    <td>8000</td>
                    <td>技术部</td>
                </tr>
                <tr>
                    <td>李四</td>
                    <td>32</td>
                    <td>12000</td>
                    <td>市场部</td>
                </tr>
                <tr>
                    <td>王五</td>
                    <td>25</td>
                    <td>6000</td>
                    <td>人事部</td>
                </tr>
                <tr>
                    <td>赵六</td>
                    <td>35</td>
                    <td>15000</td>
                    <td>技术部</td>
                </tr>
            </tbody>
        </table>

        <div class="uk-margin-top">
            <button id="test-button" class="uk-button uk-button-primary">点击测试图表功能</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化表格渲染器
            const tableRenderer = new TableRender(document.getElementById('test-table'), {
                showChart: true,
                fields: {
                    name: { name: 'name', label: '姓名', type: 'text' },
                    age: { name: 'age', label: '年龄', type: 'number' },
                    salary: { name: 'salary', label: '薪资', type: 'yuan' },
                    department: { name: 'department', label: '部门', type: 'select' }
                }
            });

            // 绑定测试按钮
            document.getElementById('test-button').addEventListener('click', function() {
                const chartBtn = document.getElementById('test-table-chart');
                if (chartBtn) {
                    chartBtn.click();
                }
            });

            console.log('图表功能测试页面已加载完成');
            console.log('请点击"图表分析"按钮测试展开/收起功能');
        });
    </script>
</body>
</html>
