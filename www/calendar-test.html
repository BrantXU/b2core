<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历渲染器测试</title>
    <link rel="stylesheet" href="static/css/uikit.min.css">
    <link rel="stylesheet" href="static/css/ionicons.min.css">
    <link rel="stylesheet" href="static/css/calendar.css">
</head>
<body>
    <div class="uk-container uk-container-large uk-margin-top">
        <h1>日历渲染器测试页面</h1>
        
        <div id="calendar-container"></div>
        
        <div class="uk-margin-top">
            <h3>测试数据</h3>
            <pre id="test-data"></pre>
        </div>
    </div>

    <script src="static/js/uikit.min.js"></script>
    <script src="static/js/dom.js"></script>
    <script src="static/js/calendarRender.js"></script>
    
    <script>
        // 生成测试数据
        const testData = [
            {
                Id: '1',
                Name: '项目会议',
                StartDate: '2024-01-15',
                EndDate: '2024-01-15',
                Description: '每周项目进度会议',
                Status: '进行中'
            },
            {
                Id: '2',
                Name: '产品发布',
                StartDate: '2024-01-20',
                EndDate: '2024-01-20',
                Description: '新产品版本发布',
                Status: '已完成'
            },
            {
                Id: '3',
                Name: '客户培训',
                StartDate: '2024-01-25',
                EndDate: '2024-01-26',
                Description: '新客户产品使用培训',
                Status: '待开始'
            },
            {
                Id: '4',
                Name: '团队建设',
                StartDate: '2024-02-01',
                EndDate: '2024-02-01',
                Description: '团队户外活动',
                Status: '计划中'
            },
            {
                Id: '5',
                Name: '季度评审',
                StartDate: '2024-02-10',
                EndDate: '2024-02-10',
                Description: '第一季度业绩评审',
                Status: '重要'
            }
        ];

        // 显示测试数据
        document.getElementById('test-data').textContent = JSON.stringify(testData, null, 2);

        // 初始化日历渲染器
        const calendarOptions = {
            data: testData,
            fields: [
                { name: 'Id', type: 'string' },
                { name: 'Name', type: 'string' },
                { name: 'StartDate', type: 'date' },
                { name: 'EndDate', type: 'date' },
                { name: 'Description', type: 'string' },
                { name: 'Status', type: 'string' }
            ],
            dateField: 'StartDate', // 默认日期字段
            onEventClick: function(event, item) {
                UIkit.modal.alert(`事件详情：${item.Name}\n日期：${item.StartDate}\n状态：${item.Status}`);
            },
            onDateClick: function(date) {
                UIkit.modal.alert(`点击日期：${date.toLocaleDateString()}`);
            }
        };

        // 创建日历实例
        const calendar = new CalendarRender('calendar-container', calendarOptions, '/');
        calendar.init();
    </script>
</body>
</html>
