<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表字段过滤测试（修复版）</title>
    <link rel="stylesheet" href="/static/css/uikit.min.css">
    <link rel="stylesheet" href="/static/css/ionicons.min.css">
    <script src="/static/js/uikit.min.js"></script>
    <script src="/static/js/uikit-icons.min.js"></script>
    <script src="/static/js/dom.js"></script>
    <script src="/static/js/widgetRender.js"></script>
    <script src="/static/js/tableRender.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="uk-container uk-margin-top">
        <h2>图表字段过滤功能测试（修复版）</h2>
        
        <div id="test-table-container">
            <table id="test-table">
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>年龄</th>
                        <th>薪资</th>
                        <th>部门</th>
                    </tr>
                </thead>
                <tbody>
                    <tr data-row-id="1">
                        <td>张三</td>
                        <td>28</td>
                        <td>8000</td>
                        <td>技术部</td>
                    </tr>
                    <tr data-row-id="2">
                        <td>李四</td>
                        <td>32</td>
                        <td>12000</td>
                        <td>销售部</td>
                    </tr>
                    <tr data-row-id="3">
                        <td>王五</td>
                        <td>25</td>
                        <td>6000</td>
                        <td>技术部</td>
                    </tr>
                    <tr data-row-id="4">
                        <td>赵六</td>
                        <td>35</td>
                        <td>15000</td>
                        <td>管理层</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="uk-margin-top">
            <button class="uk-button uk-button-primary" onclick="testChart()">测试图表功能</button>
        </div>
        
        <div class="uk-margin-top">
            <h4>测试说明：</h4>
            <ul>
                <li>点击"测试图表功能"按钮</li>
                <li>X轴下拉框应该只显示文本类字段：姓名、部门</li>
                <li>Y轴下拉框应该只显示数值类字段：年龄、薪资</li>
                <li>不应该出现numericFields相关的错误</li>
            </ul>
        </div>
    </div>

    <script>
        // 初始化表格渲染器
        const tableRenderer = new TableRender('test-table', {
            fields: {
                name: { label: '姓名', type: 'text' },
                age: { label: '年龄', type: 'number' },
                salary: { label: '薪资', type: 'yuan' },
                department: { label: '部门', type: 'select' }
            },
            showChart: true
        });
        
        // 测试图表功能
        function testChart() {
            tableRenderer.showChartModal();
            
            // 检查字段过滤是否正确
            setTimeout(() => {
                const xSelect = document.getElementById('test-table-chart-x');
                const ySelect = document.getElementById('test-table-chart-y');
                
                console.log('X轴字段选项:', Array.from(xSelect.options).map(opt => opt.value));
                console.log('Y轴字段选项:', Array.from(ySelect.options).map(opt => opt.value));
                
                if (xSelect.options.length > 0 && ySelect.options.length > 0) {
                    UIkit.notification('图表字段过滤功能正常！', {status: 'success'});
                } else {
                    UIkit.notification('图表字段过滤功能异常', {status: 'danger'});
                }
            }, 100);
        }
    </script>
</body>
</html>
