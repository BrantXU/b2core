<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看板配置测试</title>
    <link rel="stylesheet" href="/static/css/uikit.min.css">
    <link rel="stylesheet" href="/static/css/ionicons.min.css">
    <script src="/static/js/uikit.min.js"></script>
    <script src="/static/js/uikit-icons.min.js"></script>
    <style>
        .kanban-column {
            min-height: 300px;
        }
        .kanban-card {
            margin-bottom: 10px;
            cursor: pointer;
        }
        .kanban-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="uk-container uk-margin-top">
        <h2>看板配置测试</h2>
        
        <!-- 控制面板 -->
        <div class="uk-margin">
            <div class="uk-grid-small uk-grid-match" uk-grid>
                <div class="uk-width-1-4@s">
                    <label class="uk-form-label">选择分类字段:</label>
                    <select class="uk-select" id="categoryFieldSelect">
                        <option value="">请选择分类字段</option>
                    </select>
                </div>
                <div class="uk-width-1-4@s">
                    <label class="uk-form-label">搜索:</label>
                    <input class="uk-input" type="text" id="searchInput" placeholder="搜索看板内容...">
                </div>
                <div class="uk-width-1-2@s uk-flex uk-flex-middle">
                    <button class="uk-button uk-button-primary uk-margin-right" id="refreshBtn">
                        <i class="icon ion-md-refresh"></i> 刷新
                    </button>
                    <button class="uk-button uk-button-default" id="addCategoryBtn">
                        <i class="icon ion-md-add"></i> 添加分类
                    </button>
                </div>
            </div>
        </div>

        <!-- 看板容器 -->
        <div id="kanbanContainer" class="uk-grid uk-grid-small uk-grid-match" uk-grid></div>
    </div>

    <script>
        // 示例配置数据
        const config = {
            "item": {
                "abs": {
                    "id": "abs",
                    "name": "概况",
                    "type": "tab",
                    "num_range": {
                        "range": "default",
                        "start": null,
                        "end": null,
                        "contain": "all"
                    },
                    "label_width": 1,
                    "val_width": "def",
                    "list_align": "def",
                    "width": 1
                },
                "name": {
                    "id": "name",
                    "name": "名称",
                    "type": "text",
                    "num_range": {
                        "range": "default",
                        "start": null,
                        "end": null,
                        "contain": "all"
                    },
                    "label_width": 1,
                    "val_width": "def",
                    "list_align": "def",
                    "width": 1,
                    "listed": 1,
                    "required": 1
                },
                "fundname": {
                    "id": "fundname",
                    "name": "基金全称",
                    "width": 2,
                    "type": "text",
                    "num_range": {
                        "range": "default",
                        "start": null,
                        "end": null,
                        "contain": "all"
                    },
                    "label_width": 1,
                    "val_width": "def",
                    "list_align": "def"
                },
                "setup_date": {
                    "id": "setup_date",
                    "listed": 1,
                    "name": "成立日期",
                    "type": "datepicker",
                    "num_range": {
                        "range": "default",
                        "start": null,
                        "end": null,
                        "contain": "all"
                    },
                    "label_width": 1,
                    "val_width": "def",
                    "list_align": "def",
                    "width": 1
                },
                "duration": {
                    "id": "duration",
                    "listed": 1,
                    "name": "基金期限",
                    "type": "text",
                    "num_range": {
                        "range": "default",
                        "start": null,
                        "end": null,
                        "contain": "all"
                    },
                    "label_width": 1,
                    "val_width": "def",
                    "list_align": "def",
                    "width": 1
                },
                "fund_state": {
                    "id": "fund_state",
                    "name": "基金阶段",
                    "type": "select_new",
                    "num_range": {
                        "range": "default",
                        "start": null,
                        "end": null,
                        "contain": "all"
                    },
                    "label_width": 1,
                    "val_width": "def",
                    "list_align": "def",
                    "props": {
                        "type_optgroup": null,
                        "type_label": "录入",
                        "type": "raw",
                        "data_source": "设立中\n投资期\n退出期\n清算期\n展期\n终止\n",
                        "payload": null,
                        "ignore_linkage": "否",
                        "multiple": "否",
                        "ajax": "否",
                        "select_all": "否",
                        "tags": "否",
                        "tags_no_layer": "否",
                        "check_priv": "否",
                        "sort_order_optgroup": null,
                        "sort_order_label": null,
                        "sort_order": null,
                        "user_list": "否",
                        "label": null,
                        "export_import": null,
                        "open_type_optgroup": null,
                        "open_type_label": null,
                        "open_type": null,
                        "link_base": null,
                        "empty_val": null,
                        "data_source_name": "否",
                        "ignore_pinyin_search": "否",
                        "dynamic": null,
                        "tags_add_view": null,
                        "list_color_label_optgroup": null,
                        "list_color_label_label": "实心色块",
                        "list_color_label": "colorall",
                        "list_color_label_ext": null,
                        "quarter_control_start": 2010,
                        "quarter_control_end": 2030,
                        "import_autoadd": "否",
                        "import_rule": null,
                        "ellipsis_optgroup": null,
                        "ellipsis_label": "关闭",
                        "ellipsis": "off",
                        "trigger_with_change": "否",
                        "rel_sort_number": "否",
                        "rel_sort_custon": null
                    },
                    "width": 1,
                    "listed": 1
                }
            }
        };

        // 示例实体数据
        const entities = [
            {
                id: '1',
                name: '基金A',
                fund_state: '设立中',
                setup_date: '2020-01-01',
                duration: '5年'
            },
            {
                id: '2',
                name: '基金B',
                fund_state: '投资期',
                setup_date: '2019-05-15',
                duration: '7年'
            },
            {
                id: '3',
                name: '基金C',
                fund_state: '退出期',
                setup_date: '2018-03-20',
                duration: '10年'
            },
            {
                id: '4',
                name: '基金D',
                fund_state: '清算期',
                setup_date: '2017-11-10',
                duration: '8年'
            },
            {
                id: '5',
                name: '基金E',
                fund_state: '设立中',
                setup_date: '2021-02-28',
                duration: '6年'
            }
        ];

        // 提取select类型字段作为看板分类选项
        function extractSelectFields(config) {
            const selectFields = {};
            
            if (config && config.item && typeof config.item === 'object') {
                for (const [fieldName, fieldConfig] of Object.entries(config.item)) {
                    // 检查字段类型是否为select或select_new
                    if (fieldConfig.type && 
                        (fieldConfig.type === 'select' || fieldConfig.type === 'select_new')) {
                        selectFields[fieldName] = {
                            label: fieldConfig.name || fieldName,
                            options: fieldConfig.props && fieldConfig.props.data_source ? 
                                fieldConfig.props.data_source.split('\n').filter(opt => opt.trim() !== '') : 
                                []
                        };
                    }
                }
            }
            
            return selectFields;
        }

        // 填充分类字段选择器
        function populateCategoryFieldSelect(selectFields) {
            const selectElement = document.getElementById('categoryFieldSelect');
            
            // 清空现有选项
            selectElement.innerHTML = '<option value="">请选择分类字段</option>';
            
            // 添加select类型字段作为选项
            for (const [fieldName, fieldInfo] of Object.entries(selectFields)) {
                const option = document.createElement('option');
                option.value = fieldName;
                option.textContent = fieldInfo.label;
                selectElement.appendChild(option);
            }
        }

        // 按分类字段分组数据
        function groupDataByCategory(entities, categoryField) {
            const groupedData = {};
            
            // 初始化分组
            groupedData['未分类'] = [];
            
            entities.forEach(entity => {
                const category = entity[categoryField] || '未分类';
                if (!groupedData[category]) {
                    groupedData[category] = [];
                }
                groupedData[category].push(entity);
            });
            
            return groupedData;
        }

        // 渲染看板
        function renderKanban(groupedData) {
            const container = document.getElementById('kanbanContainer');
            container.innerHTML = '';
            
            for (const [category, items] of Object.entries(groupedData)) {
                // 创建列
                const column = document.createElement('div');
                column.className = 'uk-width-1-4@s uk-width-1-2@m';
                
                // 创建列头部
                const columnHeader = document.createElement('div');
                columnHeader.className = 'uk-card uk-card-default';
                columnHeader.innerHTML = `
                    <div class="uk-card-header">
                        <h3 class="uk-card-title">${category} <span class="uk-badge">${items.length}</span></h3>
                    </div>
                `;
                
                // 创建列内容
                const columnBody = document.createElement('div');
                columnBody.className = 'uk-card-body kanban-column';
                
                // 添加卡片
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'uk-card uk-card-small uk-card-default uk-card-body kanban-card';
                    card.innerHTML = `
                        <h4 class="uk-card-title">${item.name}</h4>
                        <p>成立日期: ${item.setup_date || 'N/A'}</p>
                        <p>基金期限: ${item.duration || 'N/A'}</p>
                    `;
                    columnBody.appendChild(card);
                });
                
                columnHeader.appendChild(columnBody);
                column.appendChild(columnHeader);
                container.appendChild(column);
            }
        }

        // 初始化看板
        function initKanban() {
            // 提取select类型字段
            const selectFields = extractSelectFields(config);
            console.log('Select fields:', selectFields);
            
            // 填充分类字段选择器
            populateCategoryFieldSelect(selectFields);
            
            // 默认选择第一个select字段作为分类依据
            const firstSelectField = Object.keys(selectFields)[0];
            if (firstSelectField) {
                document.getElementById('categoryFieldSelect').value = firstSelectField;
                
                // 按默认分类字段分组数据
                const groupedData = groupDataByCategory(entities, firstSelectField);
                console.log('Grouped data:', groupedData);
                
                // 渲染看板
                renderKanban(groupedData);
            }
        }

        // 绑定事件
        function bindEvents() {
            // 分类字段选择事件
            document.getElementById('categoryFieldSelect').addEventListener('change', function() {
                const selectedField = this.value;
                if (selectedField) {
                    const groupedData = groupDataByCategory(entities, selectedField);
                    renderKanban(groupedData);
                }
            });
            
            // 搜索事件
            document.getElementById('searchInput').addEventListener('input', function() {
                // 简单实现搜索功能
                console.log('搜索:', this.value);
            });
            
            // 刷新按钮事件
            document.getElementById('refreshBtn').addEventListener('click', function() {
                const selectedField = document.getElementById('categoryFieldSelect').value;
                if (selectedField) {
                    const groupedData = groupDataByCategory(entities, selectedField);
                    renderKanban(groupedData);
                }
            });
            
            // 添加分类按钮事件
            document.getElementById('addCategoryBtn').addEventListener('click', function() {
                const categoryName = prompt('请输入新分类名称:');
                if (categoryName) {
                    // 简单实现添加分类功能
                    console.log('添加分类:', categoryName);
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initKanban();
            bindEvents();
        });
    </script>
</body>
</html>
