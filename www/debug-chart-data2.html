<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表数据调试 - 详细版本</title>
    <link rel="stylesheet" href="static/css/uikit.min.css">
    <link rel="stylesheet" href="static/css/ionicons.min.css">
    <script src="static/js/uikit.min.js"></script>
    <script src="static/js/uikit-icons.min.js"></script>
    <script src="static/js/dom.js"></script>
    <script src="static/js/chart.min.js"></script>
    <script src="static/js/tableRender.js"></script>
    <style>
        body { padding: 20px; }
        .test-section { margin-bottom: 30px; }
        .test-result { background: #f8f8f8; padding: 15px; border-radius: 5px; margin-top: 10px; }
        .debug-info { font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>图表数据调试 - 详细版本</h1>
    
    <div class="test-section">
        <h3>测试数据</h3>
        <table id="test-table" class="uk-table uk-table-small uk-table-striped">
            <thead>
                <tr>
                    <th>产品名称</th>
                    <th>销售数量</th>
                    <th>销售金额</th>
                    <th>日期</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>产品A</td>
                    <td>100</td>
                    <td>5000</td>
                    <td>2024-01-01</td>
                </tr>
                <tr>
                    <td>产品B</td>
                    <td>200</td>
                    <td>12000</td>
                    <td>2024-01-02</td>
                </tr>
                <tr>
                    <td>产品C</td>
                    <td>150</td>
                    <td>9000</td>
                    <td>2024-01-03</td>
                </tr>
                <tr>
                    <td>产品D</td>
                    <td>80</td>
                    <td>4000</td>
                    <td>2024-01-04</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="test-section">
        <button class="uk-button uk-button-primary" onclick="initTable()">初始化表格</button>
        <button class="uk-button uk-button-default" onclick="showChart()">显示图表面板</button>
        <button class="uk-button uk-button-secondary" onclick="debugData()">调试数据提取</button>
        <button class="uk-button uk-button-danger" onclick="generateChart()">生成图表</button>
    </div>

    <div class="test-section">
        <h3>调试信息</h3>
        <div id="debug-info" class="test-result debug-info">点击按钮查看调试信息...</div>
    </div>

    <script>
        let tableRender;
        
        function initTable() {
            const table = document.getElementById('test-table');
            
            // 字段配置
            const fields = {
                'product_name': { name: 'product_name', label: '产品名称', type: 'text' },
                'sales_quantity': { name: 'sales_quantity', label: '销售数量', type: 'number' },
                'sales_amount': { name: 'sales_amount', label: '销售金额', type: 'amount' },
                'date': { name: 'date', label: '日期', type: 'text' }
            };
            
            // 表格数据
            const data = [
                { product_name: '产品A', sales_quantity: 100, sales_amount: 5000, date: '2024-01-01' },
                { product_name: '产品B', sales_quantity: 200, sales_amount: 12000, date: '2024-01-02' },
                { product_name: '产品C', sales_quantity: 150, sales_amount: 9000, date: '2024-01-03' },
                { product_name: '产品D', sales_quantity: 80, sales_amount: 4000, date: '2024-01-04' }
            ];
            
            // 初始化表格渲染器
            tableRender = new TableRender(table, {
                fields: fields,
                data: data,
                showChart: true
            });
            
            document.getElementById('debug-info').innerHTML = '表格初始化成功！';
            console.log('表格初始化成功', tableRender);
        }
        
        function showChart() {
            if (!tableRender) {
                alert('请先初始化表格！');
                return;
            }
            
            tableRender.toggleChartModal();
            document.getElementById('debug-info').innerHTML = '图表面板已显示';
        }
        
        function debugData() {
            if (!tableRender) {
                alert('请先初始化表格！');
                return;
            }
            
            let debugInfo = '=== 调试信息 ===\n\n';
            
            // 检查 filteredData
            debugInfo += 'filteredData: ' + JSON.stringify(tableRender.filteredData, null, 2) + '\n\n';
            
            // 检查字段映射
            debugInfo += '字段配置: ' + JSON.stringify(tableRender.options.fields, null, 2) + '\n\n';
            
            // 检查文本字段和数值字段
            debugInfo += '文本字段: ' + JSON.stringify(tableRender._getTextFields()) + '\n';
            debugInfo += '数值字段: ' + JSON.stringify(tableRender._getNumericFields()) + '\n\n';
            
            // 检查表头
            debugInfo += '表头字段: ' + JSON.stringify(tableRender._getTableHeaders()) + '\n\n';
            
            // 手动测试数据提取
            const fieldLabelToName = {};
            if (tableRender.options.fields) {
                Object.entries(tableRender.options.fields).forEach(([fieldName, fieldConfig]) => {
                    const fieldLabel = fieldConfig.label || fieldName;
                    fieldLabelToName[fieldLabel] = fieldName;
                });
            }
            debugInfo += '字段标签到名称映射: ' + JSON.stringify(fieldLabelToName, null, 2) + '\n\n';
            
            // 测试提取第一个数据行的值
            if (tableRender.filteredData.length > 0) {
                const firstRow = tableRender.filteredData[0];
                debugInfo += '第一行数据: ' + JSON.stringify(firstRow, null, 2) + '\n\n';
                
                // 测试提取产品名称和销售数量
                const productNameField = fieldLabelToName['产品名称'];
                const salesQuantityField = fieldLabelToName['销售数量'];
                
                debugInfo += '产品名称字段名: ' + productNameField + '\n';
                debugInfo += '销售数量字段名: ' + salesQuantityField + '\n\n';
                
                if (productNameField && salesQuantityField) {
                    const productNameValue = firstRow[productNameField] || '';
                    const salesQuantityValue = parseFloat(firstRow[salesQuantityField]) || 0;
                    
                    debugInfo += '产品名称值: ' + productNameValue + '\n';
                    debugInfo += '销售数量值: ' + salesQuantityValue + '\n';
                }
            }
            
            document.getElementById('debug-info').innerHTML = debugInfo;
        }
        
        function generateChart() {
            if (!tableRender) {
                alert('请先初始化表格！');
                return;
            }
            
            // 手动调用图表生成
            try {
                tableRender.generateChart();
                document.getElementById('debug-info').innerHTML = '图表生成成功！';
            } catch (error) {
                document.getElementById('debug-info').innerHTML = '图表生成失败: ' + error.message + '\n' + error.stack;
                console.error('图表生成失败', error);
            }
        }
    </script>
</body>
</html>
